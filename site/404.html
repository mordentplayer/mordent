<style>
:root{--accent:#fa4d6a;--bg:#1b1b1b;--panel:#232323;--line:#333;--text:#e9e9e9;--weak:#a3a3a3}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
  font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;padding:2rem}
main{max-width:32rem;text-align:center}
svg{width:72px;height:72px;margin-bottom:1.2rem}
h1{font-size:1.8rem;margin:0 0 .5rem;letter-spacing:-.01em}
p{color:var(--weak);margin:0 0 1.4rem}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.btn{display:inline-block;padding:.7rem 1.25rem;border-radius:999px;background:var(--accent);color:#200307;font-weight:600}
.btn:hover{text-decoration:none;background:#ff6079}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
