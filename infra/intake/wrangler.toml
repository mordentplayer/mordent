name = "mordent-intake"
main = "worker.js"
compatibility_date = "2025-01-01"

# Anonymous intake endpoint for mordentplayer/mordent.
# See README.md for the one-time setup (KV namespace + GH_TOKEN secret).

workers_dev = true

# Production entry point: mordent.app/feedback (the apex itself is the `mordent`
# static-assets Worker, which owns every other path). workers_dev stays true so
# the mordent-intake.outline2319.workers.dev URL keeps working.
routes = [
  { pattern = "mordent.app/feedback*", zone_name = "mordent.app" },
]

[vars]
GH_REPO = "mordentplayer/mordent"
# DRY_RUN=1 logs the would-be dispatch and returns ok without calling GitHub.
# MUST be "0" (or removed) in production.
DRY_RUN = "0"

# Per-IP / global rate limiting and dedupe state. Create with:
#   wrangler kv namespace create INTAKE_KV
# then paste the printed id below.
[[kv_namespaces]]
binding = "INTAKE_KV"
id = "64e15885c1594c368e8367e67a9ae6a7"
