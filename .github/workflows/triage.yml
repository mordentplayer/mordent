name: Issue triage

# Auto-triage with a cheap model (opencode-go/muse-spark-1.3-contributor)
# running in a throwaway Docker sandbox. See infra/triage/README.md for the
# threat model and design.
#
# Two entry points:
#   * issues: opened            -- analyse, comment on the issue, publish the
#                                  full report to the triage-reports branch.
#   * repository_dispatch:
#       web-submission          -- classify spam first (cheap pass); spam is
#                                  dropped with a redacted note, real
#                                  submissions are investigated and then filed
#                                  as a new issue whose body is the analysis
#                                  plus the original text in a collapsed block.

on:
  issues:
    types: [opened]
  repository_dispatch:
    types: [web-submission]

# contents: write is used by the report-publishing step; issues: write is used
# to comment on issues and to file web submissions. The model sandbox never
# receives either credential.
permissions:
  contents: write
  issues: write

env:
  # The sandbox's omp asks for our local provider/model name; the gateway
  # rewrites the outbound `model` field to the upstream's real id, which is
  # bare (no provider prefix) on the zen/go endpoint.
  TRIAGE_MODEL_ID: muse-spark-1.3-contributor
  TRIAGE_UPSTREAM_MODEL: muse-spark-1.3-contributor
  TRIAGE_UPSTREAM: https://opencode.ai/zen/go
  TRIAGE_REPORT_BRANCH: triage-reports

jobs:
  # ---------------------------------------------------------------------------
  # GitHub-native issues
  # ---------------------------------------------------------------------------
  issue:
    if: >-
      github.event_name == 'issues' &&
      vars.TRIAGE_DISABLED != 'true' &&
      github.event.issue.user.type != 'Bot' &&
      !endsWith(github.event.issue.user.login, '[bot]') &&
      (vars.TRIAGE_ALLOWLIST == '' || contains(vars.TRIAGE_ALLOWLIST, github.event.issue.user.login))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: triage-issue-${{ github.event.issue.number }}
      cancel-in-progress: false

    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@v4
        with:
          # CRITICAL: do not leave the workflow token in .git/config -- the
          # sandbox mounts this tree and the model can read any file in it.
          persist-credentials: false
          fetch-depth: 0

      # Read the issue out of the event payload with jq. NEVER interpolate
      # ${{ github.event.issue.body }} into a shell line: that is a script
      # injection vector (the body is attacker-controlled).
      - name: Gate on issue body
        id: gate
        run: |
          set -euo pipefail
          jq -r '.issue.title // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/issue-title.txt"
          jq -r '.issue.body  // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/issue.md"
          bytes=$(wc -c < "$RUNNER_TEMP/issue.md")
          echo "issue body is ${bytes} bytes"
          if [ "$bytes" -lt 40 ]; then
            echo "Body under 40 bytes; skipping triage."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start credential gateway (holds the only real credential)
        id: gw
        if: steps.gate.outputs.skip == 'false'
        env:
          OPENCODE_CRED: ${{ secrets.OPENCODE_CRED }}
        run: |
          set -euo pipefail
          if [ -z "${OPENCODE_CRED:-}" ]; then
            echo "::error::OPENCODE_CRED secret is not set; refusing to run."
            exit 1
          fi
          # Ephemeral, non-sensitive, network-local bearer for the sandbox.
          # It MUST be exported: `docker run -e GW_TOKEN` (no value) copies the
          # variable out of *this process* environment, and a plain shell
          # assignment would silently pass nothing.
          export GW_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$GW_TOKEN"
          echo "gw_token=$GW_TOKEN" >> "$GITHUB_OUTPUT"

          docker network create triage-net

          # `-e OPENCODE_CRED` (no value) copies it from this step's env, so
          # the value never appears in argv or in the run logs.
          docker run -d --name triage-gw \
            --network triage-net \
            --memory=256m \
            -e OPENCODE_CRED \
            -e GW_TOKEN \
            -e GW_PORT=4000 \
            -e GW_MODEL="$TRIAGE_UPSTREAM_MODEL" \
            -e GW_UPSTREAM="$TRIAGE_UPSTREAM" \
            -e GW_SESSION="triage-issue-${{ github.event.issue.number }}" \
            -v "$GITHUB_WORKSPACE/infra/triage/bin:/gw:ro" \
            python:3.12-slim python /gw/gateway.py

          up=false
          for i in $(seq 1 30); do
            if docker logs triage-gw 2>&1 | grep -q "listening on"; then up=true; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' triage-gw 2>/dev/null)" != "true" ]; then break; fi
            sleep 1
          done
          docker logs triage-gw 2>&1 | tail -5
          if [ "$up" != "true" ]; then
            echo "::error::credential gateway did not come up; aborting"
            exit 1
          fi

          # Address the gateway by container IP: the sandbox then needs no
          # embedded-DNS resolution of the container name.
          gw_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' triage-gw)"
          echo "gateway ip: $gw_ip"
          echo "gw_host=$gw_ip" >> "$GITHUB_OUTPUT"

      - name: Build sandbox image
        if: steps.gate.outputs.skip == 'false'
        run: docker build -t mordent-triage-sandbox -f infra/triage/Dockerfile.sandbox .

      - name: Run triage agent in sandbox
        id: agent
        if: steps.gate.outputs.skip == 'false'
        continue-on-error: true
        # The ephemeral gateway token is exported here so the container can
        # inherit it with a bare `-e GW_TOKEN` (no value in argv).
        env:
          GW_TOKEN: ${{ steps.gw.outputs.gw_token }}
        run: |
          set -euo pipefail
          docker run --rm \
            --name triage-agent \
            --network triage-net \
            --memory=2g --cpus=2 \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e CARGO_TARGET_DIR=/tmp/target \
            -e TRIAGE_MODE=analyze \
            -e ISSUE_NUMBER="${{ github.event.issue.number }}" \
            -e TRIAGE_ORIGIN="A new GitHub issue was just opened." \
            -e ISSUE_TITLE_FILE=/tmp/issue-title.txt \
            -e ISSUE_BODY_FILE=/tmp/issue.md \
            -e GW_URL="http://${{ steps.gw.outputs.gw_host }}:4000" \
            -e GW_TOKEN \
            -e REPO_DIR=/work \
            -e OUT_DIR=/work \
            -e TRIAGE_MODEL_ID="$TRIAGE_MODEL_ID" \
            -e TRIAGE_MAX_TIME=1320 \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$GITHUB_WORKSPACE/infra/triage:/triage:ro" \
            -v "$RUNNER_TEMP/issue.md:/tmp/issue.md:ro" \
            -v "$RUNNER_TEMP/issue-title.txt:/tmp/issue-title.txt:ro" \
            mordent-triage-sandbox \
            bash /triage/bin/sandbox-entrypoint.sh

      - name: Scrub report
        id: scrub
        if: steps.gate.outputs.skip == 'false'
        # Both secrets are passed by name so their values never land in argv.
        env:
          GW_TOKEN: ${{ steps.gw.outputs.gw_token }}
          OPENCODE_CRED: ${{ secrets.OPENCODE_CRED }}
        run: |
          set -euo pipefail
          report="triage-reports/issue-${{ github.event.issue.number }}.md"
          if [ ! -f "$report" ]; then
            echo "::warning::Agent produced no report at $report"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 infra/triage/bin/scrub.py \
            "$report" "$report.scrubbed" \
            --redact-env GW_TOKEN \
            --redact-env OPENCODE_CRED
          mv "$report.scrubbed" "$report"
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "report_path=$report" >> "$GITHUB_OUTPUT"

      - name: Upload report artifact
        if: steps.gate.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: triage-issue-${{ github.event.issue.number }}
          path: triage-reports/
          if-no-files-found: warn
          retention-days: 90

      - name: Publish report to branch
        if: steps.gate.outputs.skip == 'false' && steps.scrub.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIAGE_COMMIT_MSG: "issue #${{ github.event.issue.number }}"
        run: |
          set -euo pipefail
          bash infra/triage/bin/publish.sh "${{ steps.scrub.outputs.report_path }}"

      # Post the concise version as a comment. The full report stays on the
      # branch and in the artifact.
      - name: Comment on issue
        id: comment
        if: steps.gate.outputs.skip == 'false' && steps.scrub.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          spam="$(python3 infra/triage/bin/report-comment.py \
            --report "${{ steps.scrub.outputs.report_path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --branch "$TRIAGE_REPORT_BRANCH" \
            --out "$RUNNER_TEMP/comment.md")"
          echo "spam=$spam" >> "$GITHUB_OUTPUT"
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/comment.md"
          if [ "$spam" = "true" ]; then
            gh label create spam --repo "$GITHUB_REPOSITORY" \
              --color "b60205" --description "Spam / abuse" 2>/dev/null || true
            gh issue edit "${{ github.event.issue.number }}" \
              --repo "$GITHUB_REPOSITORY" --add-label spam
          fi

      - name: Cleanup
        if: always()
        run: |
          docker rm -f triage-gw triage-agent 2>/dev/null || true
          docker network rm triage-net 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # Anonymous web submissions (repository_dispatch from the intake worker)
  # ---------------------------------------------------------------------------
  web:
    if: >-
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'web-submission' &&
      vars.TRIAGE_DISABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      # One web submission at a time, globally: the form is public, so this is
      # the cost/DoS control for that entry point.
      group: triage-web
      cancel-in-progress: false

    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # Everything comes out of the event payload with jq: the fields are
      # attacker-controlled and must never be interpolated into a shell line.
      - name: Gate on submission
        id: gate
        run: |
          set -euo pipefail
          jq -r '.client_payload.body    // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/submission.md"
          jq -r '.client_payload.title   // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/submission-title.txt"
          jq -r '.client_payload.type    // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/submission-type.txt"
          # The contact line is submitter PII and is deliberately NOT shown to
          # the model; it is only appended to the created issue.
          jq -r '.client_payload.contact // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/submission-contact.txt"
          bytes=$(wc -c < "$RUNNER_TEMP/submission.md")
          echo "submission body is ${bytes} bytes"
          if [ "$bytes" -lt 40 ]; then
            echo "Submission under 40 bytes; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start credential gateway (holds the only real credential)
        id: gw
        if: steps.gate.outputs.skip == 'false'
        env:
          OPENCODE_CRED: ${{ secrets.OPENCODE_CRED }}
        run: |
          set -euo pipefail
          if [ -z "${OPENCODE_CRED:-}" ]; then
            echo "::error::OPENCODE_CRED secret is not set; refusing to run."
            exit 1
          fi
          export GW_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$GW_TOKEN"
          echo "gw_token=$GW_TOKEN" >> "$GITHUB_OUTPUT"

          docker network create triage-net

          docker run -d --name triage-gw \
            --network triage-net \
            --memory=256m \
            -e OPENCODE_CRED \
            -e GW_TOKEN \
            -e GW_PORT=4000 \
            -e GW_MODEL="$TRIAGE_UPSTREAM_MODEL" \
            -e GW_UPSTREAM="$TRIAGE_UPSTREAM" \
            -e GW_SESSION="triage-web-${{ github.run_id }}" \
            -v "$GITHUB_WORKSPACE/infra/triage/bin:/gw:ro" \
            python:3.12-slim python /gw/gateway.py

          up=false
          for i in $(seq 1 30); do
            if docker logs triage-gw 2>&1 | grep -q "listening on"; then up=true; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' triage-gw 2>/dev/null)" != "true" ]; then break; fi
            sleep 1
          done
          docker logs triage-gw 2>&1 | tail -5
          if [ "$up" != "true" ]; then
            echo "::error::credential gateway did not come up; aborting"
            exit 1
          fi

          gw_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' triage-gw)"
          echo "gateway ip: $gw_ip"
          echo "gw_host=$gw_ip" >> "$GITHUB_OUTPUT"

      - name: Build sandbox image
        if: steps.gate.outputs.skip == 'false'
        run: docker build -t mordent-triage-sandbox -f infra/triage/Dockerfile.sandbox .

      # --- pass 1: cheap spam classification --------------------------------
      - name: Classify spam (cheap pass)
        id: spam
        if: steps.gate.outputs.skip == 'false'
        continue-on-error: true
        env:
          GW_TOKEN: ${{ steps.gw.outputs.gw_token }}
        run: |
          set -euo pipefail
          docker run --rm \
            --name triage-spam \
            --network triage-net \
            --memory=1g --cpus=1 \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e TRIAGE_MODE=spam \
            -e ISSUE_BODY_FILE=/tmp/issue.md \
            -e GW_URL="http://${{ steps.gw.outputs.gw_host }}:4000" \
            -e GW_TOKEN \
            -e REPO_DIR=/work \
            -e OUT_DIR=/work \
            -e TRIAGE_MODEL_ID="$TRIAGE_MODEL_ID" \
            -e TRIAGE_MAX_TIME=300 \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$GITHUB_WORKSPACE/infra/triage:/triage:ro" \
            -v "$RUNNER_TEMP/submission.md:/tmp/issue.md:ro" \
            mordent-triage-sandbox \
            bash /triage/bin/sandbox-entrypoint.sh || true

          # Fail open: anything we cannot read as "spam" is treated as real, so
          # a classifier hiccup never silently drops a genuine report.
          verdict="real"
          if [ -f spam-verdict.txt ] && grep -qiE '^VERDICT:[[:space:]]*spam' spam-verdict.txt; then
            verdict="spam"
          fi
          echo "classifier verdict: $verdict"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Write redacted spam note (no issue is created)
        id: spamnote
        if: steps.gate.outputs.skip == 'false' && steps.spam.outputs.verdict == 'spam'
        env:
          GW_TOKEN: ${{ steps.gw.outputs.gw_token }}
          OPENCODE_CRED: ${{ secrets.OPENCODE_CRED }}
        run: |
          set -euo pipefail
          grep -iE '^RATIONALE:' spam-verdict.txt | head -1 \
            | sed -E 's/^[^:]*:[[:space:]]*//' > "$RUNNER_TEMP/rationale.txt" || true
          note="triage-reports/spam-$(date -u +%Y%m%dT%H%M%SZ).md"
          python3 infra/triage/bin/spam-note.py \
            --rationale-file "$RUNNER_TEMP/rationale.txt" \
            --received "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --out "$note"
          python3 infra/triage/bin/scrub.py "$note" "$note.scrubbed" \
            --redact-env GW_TOKEN --redact-env OPENCODE_CRED
          mv "$note.scrubbed" "$note"
          rm -f spam-verdict.txt
          echo "note_path=$note" >> "$GITHUB_OUTPUT"
          echo "--- note ---"; cat "$note"

      - name: Publish spam note to branch
        if: steps.gate.outputs.skip == 'false' && steps.spam.outputs.verdict == 'spam'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIAGE_COMMIT_MSG: "web submission classified as spam"
        run: |
          set -euo pipefail
          bash infra/triage/bin/publish.sh "${{ steps.spamnote.outputs.note_path }}"

      # --- pass 2: full investigation ---------------------------------------
      - name: Run analysis in sandbox
        id: agent
        if: steps.gate.outputs.skip == 'false' && steps.spam.outputs.verdict != 'spam'
        continue-on-error: true
        env:
          GW_TOKEN: ${{ steps.gw.outputs.gw_token }}
        run: |
          set -euo pipefail
          docker run --rm \
            --name triage-agent \
            --network triage-net \
            --memory=2g --cpus=2 \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e CARGO_TARGET_DIR=/tmp/target \
            -e TRIAGE_MODE=analyze \
            -e TRIAGE_ORIGIN="An anonymous web submission arrived (it is not a GitHub issue yet; it will be filed as one from this analysis)." \
            -e ISSUE_REF="web submission" \
            -e REPORT_RELPATH="triage-reports/pending.md" \
            -e ISSUE_TITLE_FILE=/tmp/issue-title.txt \
            -e ISSUE_BODY_FILE=/tmp/issue.md \
            -e GW_URL="http://${{ steps.gw.outputs.gw_host }}:4000" \
            -e GW_TOKEN \
            -e REPO_DIR=/work \
            -e OUT_DIR=/work \
            -e TRIAGE_MODEL_ID="$TRIAGE_MODEL_ID" \
            -e TRIAGE_MAX_TIME=1320 \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$GITHUB_WORKSPACE/infra/triage:/triage:ro" \
            -v "$RUNNER_TEMP/submission.md:/tmp/issue.md:ro" \
            -v "$RUNNER_TEMP/submission-title.txt:/tmp/issue-title.txt:ro" \
            mordent-triage-sandbox \
            bash /triage/bin/sandbox-entrypoint.sh

      - name: Scrub analysis
        id: scrub
        if: steps.gate.outputs.skip == 'false' && steps.spam.outputs.verdict != 'spam'
        env:
          GW_TOKEN: ${{ steps.gw.outputs.gw_token }}
          OPENCODE_CRED: ${{ secrets.OPENCODE_CRED }}
        run: |
          set -euo pipefail
          report="triage-reports/pending.md"
          if [ ! -f "$report" ]; then
            echo "::warning::Agent produced no analysis at $report"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 infra/triage/bin/scrub.py "$report" "$report.scrubbed" \
            --redact-env GW_TOKEN --redact-env OPENCODE_CRED
          mv "$report.scrubbed" "$report"
          echo "present=true" >> "$GITHUB_OUTPUT"

      # File the submission as a real issue. Runs even if the analysis failed,
      # so a genuine report is never lost.
      - name: Create issue from submission
        id: create
        if: steps.gate.outputs.skip == 'false' && steps.spam.outputs.verdict != 'spam'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="$(cat "$RUNNER_TEMP/submission-title.txt")"
          type="$(cat "$RUNNER_TEMP/submission-type.txt")"
          # Only an explicit [bug]/[feature] prefix counts as "already marked".
          # A user title that merely starts with a bracket (e.g. "[Windows]
          # app crashes on launch") must still get the type marker.
          case "$title" in
            \[[Bb]ug\]*|\[[Ff]eature\]*) ;;
            *) case "$type" in
                 bug|feature) title="[$type] $title" ;;
                 *)           title="[web] $title" ;;
               esac ;;
          esac

          python3 infra/triage/bin/compose-web-issue.py \
            --submission "$RUNNER_TEMP/submission.md" \
            --contact "$RUNNER_TEMP/submission-contact.txt" \
            --analysis triage-reports/pending.md \
            --out "$RUNNER_TEMP/issue-body.md"

          # Only create the label if it is missing; never overwrite an existing
          # label's colour/description.
          gh label create from-web --repo "$GITHUB_REPOSITORY" \
            --color "ededed" --description "Submitted via the anonymous web form" \
            2>/dev/null || true

          url="$(gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title="$title" \
            --body-file "$RUNNER_TEMP/issue-body.md" \
            --label from-web)"
          echo "created issue: $url"
          number="${url##*/}"
          echo "number=$number" >> "$GITHUB_OUTPUT"

          if [ -f triage-reports/pending.md ]; then
            mv triage-reports/pending.md "triage-reports/issue-${number}.md"
            echo "report_path=triage-reports/issue-${number}.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish report to branch
        if: steps.gate.outputs.skip == 'false' && steps.spam.outputs.verdict != 'spam' && steps.create.outputs.report_path != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIAGE_COMMIT_MSG: "web submission -> issue #${{ steps.create.outputs.number }}"
        run: |
          set -euo pipefail
          bash infra/triage/bin/publish.sh "${{ steps.create.outputs.report_path }}"

      - name: Upload report artifact
        if: steps.gate.outputs.skip == 'false' && steps.spam.outputs.verdict != 'spam'
        uses: actions/upload-artifact@v4
        with:
          name: triage-web-${{ github.run_id }}
          path: triage-reports/
          if-no-files-found: warn
          retention-days: 90

      - name: Cleanup
        if: always()
        run: |
          docker rm -f triage-gw triage-agent triage-spam 2>/dev/null || true
          docker network rm triage-net 2>/dev/null || true
