name: Release

on:
  push:
    # CalVer tags: 2026-10-10.N (see scripts/release.sh). The pattern matches a
    # YYYY-MM-DD prefix plus any suffix, so each same-day release (.1, .2, …)
    # fires this workflow.
    tags: ['20[0-9][0-9]-*']
  # Test builds from any branch: artifacts only, no GitHub release (the release
  # step below is gated on `github.ref_type == 'tag'`). Runs are versioned
  # "test" — see VERSION.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Release/asset version. Tag runs use the tag (CalVer); manual runs have no
  # tag, so every name that would carry it falls back to "test".
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'test' }}
  # Exact CalVer tag compiled into the binary (src/update.rs reads it with
  # option_env! so the app can compare itself against the newest release and
  # show the precise version). A manual run sets "test", which is not a version
  # and is ignored — the app then falls back to the Cargo version.
  MORDENT_BUILD_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'test' }}
  WRAPPER_REPO: https://github.com/WorldObservationLog/wrapper
  # Canonical NDK r23b URL: dl.google.com is blocked on some networks, the
  # gvt1 mirror is the documented alternative.
  NDK_URL: https://redirector.gvt1.com/edgedl/android/repository/android-ndk-r23b-linux.zip

jobs:
  # ---- 1. the app: linux -------------------------------------------------
  build-mordent:
    name: mordent (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Edition 2024 → Rust 1.85 floor; pin to stable (ahead of that floor).
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # eframe/winit/glutin (x11 + wayland) and rodio/cpal (alsa) build deps.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev

      - name: Build (release)
        run: cargo build --release --locked

      - name: Upload mordent binary
        uses: actions/upload-artifact@v4
        with:
          name: mordent-binary
          path: target/release/mordent
          if-no-files-found: error

  # ---- 2. the third-party wrapper backend (linux only) -------------------
  build-wrapper:
    name: wrapper-lite (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential unzip

      - name: Clone wrapper-lite (lite branch)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch lite "$WRAPPER_REPO" wrapper-src
          # Pin the exact revision in the bundle so the build is auditable.
          git -C wrapper-src rev-parse HEAD | tee wrapper-src/WRAPPER_COMMIT
          git -C wrapper-src log -1 --oneline

      - name: Install Android NDK r23b
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 -o ndk.zip "$NDK_URL"
          unzip -q ndk.zip -d wrapper-src
          test -d wrapper-src/android-ndk-r23b

      - name: Build (cmake)
        working-directory: wrapper-src
        run: |
          set -euo pipefail
          # BUILD_HOST_LAUNCHERS is ON by default: builds wrapper-lite +
          # wrapper-lite-rootless (host launchers) alongside the Android-layer
          # `lite` binary.
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          test -x wrapper-lite
          test -x wrapper-lite-rootless
          test -x rootfs/system/bin/lite

      - name: Assemble wrapper payload
        run: |
          set -euo pipefail
          mkdir -p wrapper-out
          cp wrapper-src/wrapper-lite wrapper-out/wrapper-lite
          # The rootless launcher is what the container image runs (it does its
          # own user namespace + chroot); shipped in the payload so
          # build-container can stage it into the image build context.
          cp wrapper-src/wrapper-lite-rootless wrapper-out/wrapper-lite-rootless
          cp wrapper-src/WRAPPER_COMMIT wrapper-out/WRAPPER_COMMIT
          cp wrapper-src/LICENSE wrapper-out/LICENSE-wrapper.txt
          cp wrapper-src/README.md wrapper-out/README-wrapper.md

          # rootfs skeleton = tracked files only (git archive), so no
          # per-machine login state (DEV_TOKEN/MUSIC_TOKEN/… ) can leak in.
          git -C wrapper-src archive HEAD rootfs | tar -x -C wrapper-out
          # …plus the freshly built Android-layer binary.
          cp wrapper-src/rootfs/system/bin/lite wrapper-out/rootfs/system/bin/lite

          test ! -e wrapper-out/rootfs/data/MUSIC_TOKEN
          test ! -e wrapper-out/rootfs/data/DEV_TOKEN
          test -x wrapper-out/rootfs/system/bin/lite
          chmod 0755 wrapper-out/wrapper-lite
          chmod 0755 wrapper-out/wrapper-lite-rootless
          find wrapper-out -maxdepth 1 -mindepth 1 -printf '%f\n' | sort

      - name: Upload wrapper payload
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-payload
          path: wrapper-out
          if-no-files-found: error

  # ---- 3. the friend's Mac backend: wrapper-lite in a container -----------
  # The FairPlay payload is Android x86-64, so the image is linux/amd64 only
  # (see docs/macos-container/FINDINGS.md §1). Runner is amd64, so this is a
  # native build. The image is shipped as a `docker save` tarball; the name
  # below is exactly what docs/macos-container/README-friend.md tells friends
  # to `docker load`.
  build-container:
    name: wrapper-lite container (linux amd64)
    needs: [build-wrapper]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download wrapper payload
        uses: actions/download-artifact@v4
        with:
          name: wrapper-payload
          path: in/wrapper

      # The Dockerfile COPYs wrapper-lite-rootless + rootfs from its build
      # context (docs/macos-container/), so stage them there before building.
      - name: Stage container build context
        working-directory: docs/macos-container
        run: |
          set -euo pipefail
          echo "cwd: $(pwd)"
          ls -la ../../in/wrapper
          install -m 0755 ../../in/wrapper/wrapper-lite-rootless wrapper-lite-rootless
          cp -a ../../in/wrapper/rootfs rootfs
          # `actions/download-artifact` extraction does not reliably preserve
          # the executable bit, so set it explicitly on both staged binaries
          # before the checks below (the Dockerfile chmods its own copies too).
          chmod 0755 wrapper-lite-rootless rootfs/system/bin/lite
          ls -l wrapper-lite-rootless rootfs/system/bin/lite
          test -x wrapper-lite-rootless
          test -x rootfs/system/bin/lite
          # Login state must never reach the image (the Dockerfile also
          # `rm -rf /app/rootfs/data`; .dockerignore excludes it from the
          # context). Fail loudly if the payload ever gained any.
          test -z "$(find rootfs/data -mindepth 1 -print -quit 2>/dev/null || true)"
          find . -maxdepth 1 -mindepth 1 -printf '%f\n' | sort

      - name: Build image
        working-directory: docs/macos-container
        run: docker build -t wrapper-lite:amd64 .

      - name: Export image tarball
        working-directory: docs/macos-container
        run: |
          set -euo pipefail
          docker image inspect wrapper-lite:amd64 \
            --format 'image: os={{.Os}} arch={{.Architecture}} size={{.Size}}'
          test "$(docker image inspect wrapper-lite:amd64 --format '{{.Architecture}}')" = "amd64"
          docker save wrapper-lite:amd64 | gzip -1 > wrapper-lite-amd64.tar.gz
          test -s wrapper-lite-amd64.tar.gz
          ls -l wrapper-lite-amd64.tar.gz

      - name: Upload container image
        uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: docs/macos-container/wrapper-lite-amd64.tar.gz
          if-no-files-found: error

  # ---- 4. the app: macOS (macos-14 is arm64; build the Intel slice too) --
  build-macos:
    name: mordent (macos ${{ matrix.arch }})
    # macos-14 is arm64 but now marked deprecated by actions/runner-images;
    # it still works, and macos-15 (also arm64) is the drop-in replacement.
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      # Edition 2024 → Rust 1.85 floor; pin to stable (ahead of that floor).
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package tarball + Mordent.app
        run: |
          set -euo pipefail
          pkg="mordent-${VERSION}-macos-${{ matrix.arch }}"
          root="dist/${pkg}"
          mkdir -p "$root"
          cp "target/${{ matrix.target }}/release/mordent" "$root/mordent"
          cp README.md "$root/README.md"
          cat > "$root/WRAPPER-NOTICE.txt" <<'EOF'
          The FairPlay wrapper is Linux-only. On macOS/Windows, point Mordent at a remote wrapper (Setup → Wrapper → remote URL).
          EOF
          # tarball first, so the bare-binary bundle for scripts/advanced users
          # stays free of the .app below.
          tar -C dist -czf "${pkg}.tar.gz" "${pkg}"

          # Double-clickable bundle: Mordent.app (icon + Info.plist) zipped with
          # `ditto --keepParent`, which is what makes Finder unpack it back into
          # a .app rather than a loose directory.
          bash packaging/macos/build-app.sh \
            "target/${{ matrix.target }}/release/mordent" "${VERSION}" "dist/${pkg}" \
            "Mordent-${VERSION}-macos-${{ matrix.arch }}.zip"

          echo "PKG=${pkg}" >> "$GITHUB_ENV"
          echo "APPZIP=Mordent-${VERSION}-macos-${{ matrix.arch }}.zip" >> "$GITHUB_ENV"

      - name: Upload macos bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: |
            ${{ env.PKG }}.tar.gz
            ${{ env.APPZIP }}
          if-no-files-found: error

  # ---- 5. the app: Windows ----------------------------------------------
  build-windows:
    name: mordent (windows x86_64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Edition 2024 → Rust 1.85 floor; pin to stable (ahead of that floor).
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --locked

      - name: Package zip
        shell: pwsh
        run: |
          $pkg = "mordent-$env:VERSION-windows-x86_64"
          $root = "dist/$pkg"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item "target/release/mordent.exe" "$root/mordent.exe"
          Copy-Item "README.md" "$root/README.md"
          @'
          The FairPlay wrapper is Linux-only. On macOS/Windows, point Mordent at a remote wrapper (Setup → Wrapper → remote URL).
          '@ | Set-Content -Path "$root/WRAPPER-NOTICE.txt" -Encoding utf8NoBOM
          Compress-Archive -Path $root -DestinationPath "$pkg.zip" -Force
          "PKG=$pkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Upload windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}.zip
          if-no-files-found: error

  # ---- 6. bundle + the one release creator -------------------------------
  # Single `action-gh-release` step for the whole workflow: two jobs creating
  # the same tag's release concurrently would race on assets.
  bundle:
    name: bundle + release
    needs: [build-mordent, build-wrapper, build-container, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download mordent binary
        uses: actions/download-artifact@v4
        with:
          name: mordent-binary
          path: in/mordent

      - name: Download wrapper payload
        uses: actions/download-artifact@v4
        with:
          name: wrapper-payload
          path: in/wrapper

      # The container image (linux/amd64 `docker save` tarball) and the compose
      # file are published as loose release assets — a friend loads the tarball
      # and starts it from the compose file (see README-friend.md).
      - name: Download container image
        uses: actions/download-artifact@v4
        with:
          name: container-image
          path: in/container

      # The macOS/Windows bundles are published as-is; only linux bundles the
      # wrapper (the FairPlay backend is linux-only).
      - name: Download macos bundles
        uses: actions/download-artifact@v4
        with:
          pattern: mordent-*-macos-*
          path: in/release
          merge-multiple: true

      - name: Download windows bundle
        uses: actions/download-artifact@v4
        with:
          pattern: mordent-*-windows-*
          path: in/release
          merge-multiple: true

      - name: Assemble bundle
        run: |
          set -euo pipefail
          tag="$VERSION"
          pkg="mordent-${tag}-linux-x86_64"
          root="dist/${pkg}"
          mkdir -p "$root/licenses"

          # the app
          install -m 0755 in/mordent/mordent "$root/mordent"

          # the third-party backend (binary + rootfs skeleton)
          install -m 0755 in/wrapper/wrapper-lite "$root/wrapper-lite"
          cp -a in/wrapper/rootfs "$root/rootfs"
          # `actions/download-artifact` does not preserve the executable bit, so
          # restore it on the chroot payload binaries (build-container stages the
          # same rootfs and chmods its copy for exactly this reason). Without it
          # the wizard's local install copies a non-executable `lite`.
          chmod 0755 "$root/rootfs/system/bin/lite" "$root/rootfs/system/bin/linker64"
          test -x "$root/rootfs/system/bin/lite"
          cp in/wrapper/WRAPPER_COMMIT "$root/WRAPPER_COMMIT"

          # setup scripts + systemd unit the wizard drives
          cp -a scripts "$root/scripts"

          # Icons for the one-line installer: scripts/install.sh looks for
          # <payload>/assets/icon/{mordent-*.png, mordent.iconset/icon_*.png} and
          # installs them into share/icons/hicolor/<size>/apps/, falling back to
          # a placeholder icon when the directory is absent. `assets/brand/` is
          # deliberately not shipped — install.sh never reads it.
          install -d "$root/assets"
          cp -a assets/icon "$root/assets/icon"

          # docs + licenses
          cp README.md "$root/README.md"
          cp assets/fonts/LICENSE-DejaVu.txt "$root/licenses/LICENSE-DejaVu.txt"
          cp assets/fonts/LICENSE-Inter.txt "$root/licenses/LICENSE-Inter.txt"
          cp in/wrapper/LICENSE-wrapper.txt "$root/licenses/LICENSE-wrapper.txt"
          cp in/wrapper/README-wrapper.md "$root/licenses/README-wrapper.md"

          # Guard: a payload without the icon set silently degrades to a
          # placeholder menu icon in every one-liner install. Fail loudly here
          # instead of shipping that (both halves of install_icons_from).
          icon_pngs=("$root"/assets/icon/mordent-*.png)
          icon_set=("$root"/assets/icon/mordent.iconset/icon_*.png)
          [[ -f "${icon_pngs[0]}" ]] ||
            { echo "::error::bundle is missing assets/icon/mordent-*.png — install.sh would install a placeholder icon"; exit 1; }
          [[ -f "${icon_set[0]}" ]] ||
            { echo "::error::bundle is missing assets/icon/mordent.iconset/icon_*.png — install.sh would install a placeholder icon"; exit 1; }
          echo "icons: ${#icon_pngs[@]} PNG(s) + ${#icon_set[@]} iconset file(s)"

          tar -C dist -czf "${pkg}.tar.gz" "${pkg}"

          # sanity-check the archive before it goes out. List the archive once
          # into a file: streaming `tar -t | grep -q` trips `set -o pipefail`
          # (grep exits on the first match and tar then dies with SIGPIPE, a
          # false "bundle is missing ...").
          tar -tzf "${pkg}.tar.gz" >"${pkg}.list"
          for p in \
            mordent \
            wrapper-lite \
            rootfs/system/bin/lite \
            scripts/install-wrapper.sh \
            scripts/login-wrapper.sh \
            scripts/mordent-wrapper.service \
            WRAPPER_COMMIT \
            README.md \
            assets/icon/mordent-256.png \
            assets/icon/mordent.iconset/icon_256x256.png \
            licenses/LICENSE-DejaVu.txt \
            licenses/LICENSE-Inter.txt \
            licenses/LICENSE-wrapper.txt; do
            grep -qx "${pkg}/${p}" "${pkg}.list" ||
              { echo "::error::bundle is missing ${p}"; exit 1; }
          done
          rm -f "${pkg}.list"
          echo "PKG=${pkg}" >> "$GITHUB_ENV"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}.tar.gz
          if-no-files-found: error

      # Graphical install for Linux: the same payload as the tarball above,
      # repackaged as an AppImage (see packaging/appimage/). Put *after* the
      # tarball step so the tarball stays exactly as it was.
      - name: Assemble AppImage
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          appimage="mordent-${VERSION}-x86_64.AppImage"
          # --appimage-extract-and-run: no FUSE needed on the runner.
          APPIMAGETOOL="$PWD/appimagetool" APPIMAGETOOL_ARGS=--appimage-extract-and-run \
            bash packaging/appimage/build-appimage.sh "dist/${PKG}" "$appimage"

          # Prove the artifact is a real, extractable AppImage with the payload
          # the wizard needs at <exe_dir>/../scripts.
          "./${appimage}" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/mordent
          test -x squashfs-root/usr/wrapper-lite
          test -f squashfs-root/usr/scripts/install-wrapper.sh
          test -f squashfs-root/usr/rootfs/system/bin/lite
          test -f squashfs-root/usr/share/icons/hicolor/256x256/apps/mordent.png
          test -f squashfs-root/mordent.desktop
          rm -rf squashfs-root
          echo "APPIMAGE=${appimage}" >> "$GITHUB_ENV"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APPIMAGE }}
          path: ${{ env.APPIMAGE }}
          if-no-files-found: error

      # Checksums for every published asset, in one file, with the exact asset
      # names: the in-app updater (src/update.rs) downloads an asset only when
      # it finds its SHA-256 here. Integrity, not authenticity — the artifacts
      # are not signed, which the README states.
      - name: Checksums
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "${PKG}.tar.gz" "${APPIMAGE}" release-assets/
          cp in/container/wrapper-lite-amd64.tar.gz release-assets/
          cp docs/macos-container/compose.yaml release-assets/
          cp in/release/*.tar.gz in/release/*.zip release-assets/
          # The curl | bash installer is a release asset too (so
          # .../releases/latest/download/install.sh resolves for every tag).
          cp scripts/install.sh release-assets/
          # Bare file names (exactly the published asset names), no "./" prefix.
          ( cd release-assets && sha256sum * >../SHA256SUMS )
          # Every asset must appear exactly once (a renamed/duplicated asset
          # would silently drop out of the updater's lookup).
          for f in release-assets/*; do
            grep -q "  ${f#release-assets/}$" SHA256SUMS ||
              { echo "::error::SHA256SUMS is missing ${f#release-assets/}"; exit 1; }
          done
          cat SHA256SUMS

      # Tag runs only: a manual (workflow_dispatch) run builds artifacts for
      # testing and stops here — no release is created, no assets are published.
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PKG }}.tar.gz
            ${{ env.APPIMAGE }}
            SHA256SUMS
            release-assets/install.sh
            in/container/wrapper-lite-amd64.tar.gz
            docs/macos-container/compose.yaml
            in/release/*.tar.gz
            in/release/*.zip
          generate_release_notes: true
