[package]
name = "amc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
temari = "0.3"
parking_lot = "0.12"
rodio = "0.20"
symphonia = { version = "0.5", default-features = false, features = ["aac", "alac", "isomp4", "mpa", "pcm"] }
eframe = "=0.32.3"
log = "0.4.34"
# MPRIS2 (already a transitive dep of eframe/accesskit on Linux — zero added packages)
zbus = "5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
