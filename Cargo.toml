[package]
name = "mordent"
version = "2026.10.10"
edition = "2024"
description = "Mordent — a native, fast Apple Music client"

[dependencies]
anyhow = "1"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
temari = "0.3"
parking_lot = "0.12"
rodio = "0.20"
symphonia = { version = "0.5", default-features = false, features = ["aac", "alac", "isomp4", "mpa", "pcm"] }
eframe = "=0.32.3"
log = "0.4.34"
# MPRIS2 (already a transitive dep of eframe/accesskit on Linux — zero added packages)
zbus = "5"
# Local timezone offset for play reporting (seconds east of UTC).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Tray (StatusNotifierItem) is a Linux/desktop-linux concept; macOS/Windows
# builds compile a stub (`src/tray.rs` is cfg-gated in main.rs) — ✕ still
# hides the window there, restore via MPRIS Raise or a relaunch.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
