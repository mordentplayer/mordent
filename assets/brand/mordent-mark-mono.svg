<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 735 556" width="735" height="556" role="img" aria-label="Mordent">
  <!--
    Mordent brand asset — see assets/brand/brand.md for the full system.
    Mark: a mordent ornament abstracted to a single stroke — 60° zigzag with a
    75° descending tail, ribbon 0.56 (zigzag-run units), ends cut horizontally
    on a common baseline, mitred joins.  One filled path: recolourable, and the
    same geometry `src/brand.rs` rasterises for the tray / window icon.
    Palette: accent #fa4d6a · panel #26262a→#161619 · ink #f5f5f7.

    Monochrome / single-colour mark: inherits `color`, so it works on any
    background (ink #1b1b1b on light, #f5f5f7 on dark) and is what the
    tray icon rasterises.
  -->
  <title>Mordent mark</title>
  <path d="M 138.2 431.6 L 247.8 241.7 L 409.9 522.3 L 556.4 268.5 L 607.6 459.7 L 701.6 459.7 L 587.4 33.4 L 409.9 340.9 L 247.8 60.2 L 33.4 431.6 Z" fill="currentColor"/>
</svg>
