<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"
     role="img" aria-label="Mordent">
  <title>Mordent</title>
  <!-- Dark rounded square with a faint warm lift towards the top-left, so the
       flat panel does not read as a dead rectangle. -->
  <defs>
    <radialGradient id="bg" cx="0.32" cy="0.24" r="0.95">
      <stop offset="0" stop-color="#26262a"/>
      <stop offset="1" stop-color="#161619"/>
    </radialGradient>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="212" ry="212" fill="url(#bg)"/>

  <!-- The mordent ornament: an angular zigzag with a descending tail
       ("N-with-tail"), one stroked polyline in the app's warm accent
       (#fa4d6a, the default theme accent in src/theme.rs). -->
  <path d="M 251 610 L 399 378 L 547 610 L 695 378 L 763 650"
        fill="none" stroke="#fa4d6a" stroke-width="74"
        stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/>
</svg>
